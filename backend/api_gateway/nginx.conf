events {}
http {
    server {
        listen 80;

        location /api/v1/auth {
            proxy_pass http://auth-service:8080;
        }

        location /api/v1/user {
            proxy_pass http://user-service:8080;
        }

        location /api/v1/product {
            proxy_pass http://product-service:8080;
        }
    }
}