version: '3.8'

services:
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_USER}
    ports:
      - "5432:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
  
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CATALOG}
    ports:
      - "5433:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
  
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_ORDER}
    ports:
      - "5434:5432"
    volumes:
      - order_data:/var/lib/postgresql/data 
  
  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn user_service.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${USER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - user-db
    
  catalog-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn catalog_service.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - catalog-db
  
  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn order_service.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - order-db
  
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./backend/api-gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - catalog-service
      - order-service

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   #s3 api
      - "9001:9001"   #web-console
    volumes:
      - minio_data:/data

volumes:
  user_data:
  catalog_data:
  order_data:  
  minio_data: